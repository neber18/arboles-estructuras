<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreatTree | Monitor de Incidentes de Red</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #171d25;
  --line: #263040;
  --text: #e6edf3;
  --muted: #8b98a8;
  --accent: #3fb6ff;
  --low: #3ecf8e;
  --mid: #f5b942;
  --high: #ff5d5d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
header { display: flex; justify-content: space-between; align-items: center; padding: 18px 32px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 22px; letter-spacing: .5px; }
header h1 span { color: var(--accent); }
header p { color: var(--muted); font-size: 13px; margin-top: 2px; }
main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px 32px; }
aside { display: flex; flex-direction: column; gap: 20px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 14px; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
input, select { width: 100%; padding: 9px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 14px; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
button { margin-top: 14px; width: 100%; padding: 10px; border: none; border-radius: 6px; background: var(--accent); color: #04121c; font-weight: 600; cursor: pointer; }
button:hover { filter: brightness(1.1); }
.msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
.msg.error { color: var(--high); }
.msg.ok { color: var(--low); }
.result { font-size: 13px; line-height: 1.7; margin-top: 12px; color: var(--muted); }
.result strong { color: var(--text); }
.result code { color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.stat b { display: block; font-size: 26px; }
.stat small { color: var(--muted); font-size: 12px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
#canvas { width: 100%; overflow-x: auto; }
svg text { font-family: Consolas, monospace; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
td.ip { font-family: Consolas, monospace; }
.badge { padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #0f1419; }
.del { margin: 0; width: auto; padding: 4px 10px; background: transparent; border: 1px solid var(--high); color: var(--high); font-size: 12px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; padding: 16px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Threat<span>Tree</span></h1>
    <p>Monitor de IPs sospechosas con Árbol Binario de Búsqueda</p>
  </div>
  <p id="root-label"></p>
</header>

<main>
  <aside>
    <section class="panel">
      <h2>Registrar incidente</h2>
      <form id="add-form">
        <label for="ip">Dirección IP</label>
        <input id="ip" placeholder="ej. 45.33.12.9" required>
        <label for="attack">Tipo de ataque</label>
        <select id="attack">
          <option value="Brute force">Fuerza bruta</option>
          <option value="Port scan">Escaneo de puertos</option>
          <option value="SQL injection">Inyección SQL</option>
          <option value="XSS">XSS</option>
          <option value="DDoS">DDoS</option>
          <option value="Phishing">Phishing</option>
          <option value="Malware C2">Malware C2</option>
          <option value="Credential stuffing">Relleno de credenciales</option>
        </select>
        <label for="level">Nivel de amenaza (1 - 10)</label>
        <input id="level" type="number" min="1" max="10" value="5" required>
        <button type="submit">Agregar al árbol</button>
        <div id="add-msg" class="msg"></div>
      </form>
    </section>

    <section class="panel">
      <h2>Buscar IP</h2>
      <form id="search-form">
        <input id="search-ip" placeholder="IP a consultar" required>
        <button type="submit">Buscar</button>
      </form>
      <div id="search-result" class="result"></div>
    </section>
  </aside>

  <section>
    <div class="stats" id="stats"></div>

    <div class="panel" style="margin-bottom: 20px;">
      <h2>Vista del árbol</h2>
      <div class="legend">
        <span><i style="background: var(--low)"></i>Bajo (1-4)</span>
        <span><i style="background: var(--mid)"></i>Medio (5-7)</span>
        <span><i style="background: var(--high)"></i>Crítico (8-10)</span>
      </div>
      <div id="canvas"></div>
    </div>

    <div class="panel">
      <h2>Recorrido in-order (ascendente por IP)</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Dirección IP</th>
            <th>Ataque</th>
            <th>Amenaza</th>
            <th>Intentos</th>
            <th>Nivel</th>
            <th>Grado</th>
            <th>Tipo de nodo</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
let highlighted = [];
let lastTree = null;

const ATTACKS = {
  "Brute force": "Fuerza bruta",
  "Port scan": "Escaneo de puertos",
  "SQL injection": "Inyección SQL",
  "Credential stuffing": "Relleno de credenciales",
  "Unknown": "Desconocido",
};

const ROLES = { Root: "Raíz", Branch: "Rama", Leaf: "Hoja" };

const ERRORS = {
  "Invalid IP address or threat level": "Dirección IP o nivel de amenaza inválido",
  "Invalid IP address": "Dirección IP inválida",
  "IP not found": "IP no encontrada",
};

function attackName(value) {
  return ATTACKS[value] || value;
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function levelColor(level) {
  if (level >= 8) return "#ff5d5d";
  if (level >= 5) return "#f5b942";
  return "#3ecf8e";
}

async function api(url, options = {}) {
  const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
  const data = await res.json();
  if (!res.ok) throw new Error(ERRORS[data.error] || "Error en la solicitud");
  return data;
}

function layout(node, depth, positions, counter) {
  if (!node) return;
  layout(node.left, depth + 1, positions, counter);
  positions.push({ node, x: counter.i++, y: depth });
  layout(node.right, depth + 1, positions, counter);
}

function drawTree(root) {
  const canvas = document.getElementById("canvas");
  if (!root) {
    canvas.innerHTML = '<p class="result">El árbol está vacío.</p>';
    return;
  }

  const positions = [];
  layout(root, 0, positions, { i: 0 });

  const gapX = 120;
  const gapY = 90;
  const depth = Math.max(...positions.map(p => p.y));
  const width = Math.max(positions.length * gapX, canvas.clientWidth);
  const height = (depth + 1) * gapY + 60;
  const offset = (width - positions.length * gapX) / 2 + gapX / 2;

  const point = {};
  positions.forEach(p => {
    point[p.node.ip] = { cx: offset + p.x * gapX, cy: 40 + p.y * gapY };
  });

  let edges = "";
  let nodes = "";

  positions.forEach(({ node }) => {
    const a = point[node.ip];
    [node.left, node.right].forEach(child => {
      if (!child) return;
      const b = point[child.ip];
      const active = highlighted.includes(node.ip) && highlighted.includes(child.ip);
      edges += `<line x1="${a.cx}" y1="${a.cy}" x2="${b.cx}" y2="${b.cy}" stroke="${active ? "#3fb6ff" : "#334155"}" stroke-width="${active ? 3 : 1.5}"/>`;
    });

    const active = highlighted.includes(node.ip);
    nodes += `
      <g>
        <title>${esc(node.ip)} | ${esc(attackName(node.attack_type))} | intentos: ${node.hits}</title>
        <circle cx="${a.cx}" cy="${a.cy}" r="24" fill="${active ? "#10283a" : "#0f1419"}" stroke="${levelColor(node.threat_level)}" stroke-width="${active ? 5 : 3}"/>
        <text x="${a.cx}" y="${a.cy + 5}" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">${node.threat_level}</text>
        <text x="${a.cx}" y="${a.cy + 42}" text-anchor="middle" fill="${active ? "#3fb6ff" : "#8b98a8"}" font-size="11">${esc(node.ip)}</text>
      </g>`;
  });

  canvas.innerHTML = `<svg width="${width}" height="${height}">${edges}${nodes}</svg>`;
}

function renderStats(stats) {
  const items = [
    ["Peso (nodos)", stats.weight],
    ["Altura", stats.height],
    ["Hojas", stats.leaves],
    ["Ramas", stats.branches],
    ["IPs críticas", stats.critical],
  ];
  document.getElementById("stats").innerHTML = items
    .map(([label, value]) => `<div class="stat"><b>${value}</b><small>${label}</small></div>`)
    .join("");
  document.getElementById("root-label").textContent = stats.root ? `Nodo raíz: ${stats.root}` : "Sin raíz todavía";
}

function renderRecords(records) {
  const body = document.getElementById("records");
  body.innerHTML = records.map((r, i) => `
    <tr>
      <td>${i + 1}</td>
      <td class="ip">${esc(r.ip)}</td>
      <td>${esc(attackName(r.attack_type))}</td>
      <td><span class="badge" style="background:${levelColor(r.threat_level)}">${r.threat_level}</span></td>
      <td>${r.hits}</td>
      <td>${r.level}</td>
      <td>${r.degree}</td>
      <td>${ROLES[r.role] || r.role}</td>
      <td><button class="del" data-ip="${esc(r.ip)}">Eliminar</button></td>
    </tr>`).join("");
}

function render(data) {
  lastTree = data.tree;
  renderStats(data.stats);
  drawTree(data.tree);
  renderRecords(data.records);
}

async function load() {
  render(await api("/api/tree"));
}

document.getElementById("add-form").addEventListener("submit", async event => {
  event.preventDefault();
  const msg = document.getElementById("add-msg");
  const ip = document.getElementById("ip").value.trim();
  try {
    const data = await api("/api/incidents", {
      method: "POST",
      body: JSON.stringify({
        ip,
        attack_type: document.getElementById("attack").value,
        threat_level: document.getElementById("level").value,
      }),
    });
    highlighted = [];
    render(data);
    msg.className = "msg ok";
    msg.textContent = `${ip} registrada.`;
    event.target.reset();
  } catch (err) {
    msg.className = "msg error";
    msg.textContent = err.message;
  }
});

document.getElementById("search-form").addEventListener("submit", async event => {
  event.preventDefault();
  const box = document.getElementById("search-result");
  const ip = document.getElementById("search-ip").value.trim();
  try {
    const data = await api(`/api/search?ip=${encodeURIComponent(ip)}`);
    highlighted = data.path;
    drawTree(lastTree);
    const route = data.path.map(p => `<code>${esc(p)}</code>`).join(" → ");
    if (data.found) {
      const r = data.record;
      box.innerHTML = `
        <strong>Encontrada</strong> en ${data.path.length} comparación(es) de ${data.total} registros.<br>
        Ataque: <strong>${esc(attackName(r.attack_type))}</strong> · Amenaza: <strong>${r.threat_level}</strong> · Intentos: <strong>${r.hits}</strong><br>
        Camino: ${route}`;
    } else {
      box.innerHTML = `<strong>No encontrada.</strong> Se hicieron ${data.path.length} comparación(es).<br>Camino: ${route || "árbol vacío"}`;
    }
  } catch (err) {
    box.innerHTML = `<span style="color: var(--high)">${esc(err.message)}</span>`;
  }
});

document.getElementById("records").addEventListener("click", async event => {
  const button = event.target.closest(".del");
  if (!button) return;
  try {
    highlighted = [];
    render(await api(`/api/incidents/${encodeURIComponent(button.dataset.ip)}`, { method: "DELETE" }));
  } catch (err) {
    alert(err.message);
  }
});

load();
</script>
</body>
</html>
